name: Commit attribution policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-attribution-policy:
    name: Commit attribution policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject AI-provider source-control attribution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          event_name = os.environ["GITHUB_EVENT_NAME"]

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)

          violations = []

          def api(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "commit-attribution-policy",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def provider_identity(name, email, login):
              n = (name or "").strip().casefold()
              e = (email or "").strip().casefold()
              l = (login or "").strip().casefold()
              return (
                  l == "claude"
                  or e == "noreply@anthropic.com"
                  or e.endswith("@anthropic.com")
                  or bool(re.match(r"^claude(?:\s|$)", n))
              )

          pr = event.get("pull_request") or {}
          if pr:
              branch = ((pr.get("head") or {}).get("ref") or "").strip()
              if re.match(r"^(?:claude|anthropic)(?:[/_.-]|$)", branch, re.I):
                  violations.append(f"provider-branded branch name is prohibited: {branch}")

              body = pr.get("body") or ""
              body_lower = body.casefold()
              for marker in (
                  "generated with [claude code]",
                  "generated by [claude code]",
                  "claude.ai/code/session_",
              ):
                  if marker in body_lower:
                      violations.append(f"provider-generated PR footer/session marker is prohibited: {marker}")

          shas = []
          if event_name == "pull_request":
              number = pr.get("number")
              page = 1
              while number:
                  commits = api(f"/repos/{repo}/pulls/{number}/commits?per_page=100&page={page}")
                  if not commits:
                      break
                  shas.extend(item["sha"] for item in commits)
                  if len(commits) < 100:
                      break
                  page += 1
          elif event_name == "push":
              shas.extend(item.get("id") for item in event.get("commits", []) if item.get("id"))
              after = event.get("after")
              if after:
                  shas.append(after)

          seen = set()
          for sha in shas:
              if not sha or sha in seen:
                  continue
              seen.add(sha)
              commit = api(f"/repos/{repo}/commits/{urllib.parse.quote(sha)}")
              raw = commit.get("commit") or {}
              author = raw.get("author") or {}
              committer = raw.get("committer") or {}
              linked_author = (commit.get("author") or {}).get("login")
              linked_committer = (commit.get("committer") or {}).get("login")

              if provider_identity(author.get("name"), author.get("email"), linked_author):
                  violations.append(
                      f"{sha}: prohibited author identity "
                      f"{author.get('name')} <{author.get('email')}> / {linked_author}"
                  )
              if provider_identity(committer.get("name"), committer.get("email"), linked_committer):
                  violations.append(
                      f"{sha}: prohibited committer identity "
                      f"{committer.get('name')} <{committer.get('email')}> / {linked_committer}"
                  )

              message = raw.get("message") or ""
              if re.search(r"(?im)^Co-Authored-By:.*(?:Claude|@anthropic\.com)", message):
                  violations.append(f"{sha}: prohibited Claude/Anthropic Co-Authored-By trailer")
              if re.search(r"(?im)^Claude-Session:", message):
                  violations.append(f"{sha}: prohibited Claude-Session trailer")
              if re.search(r"(?i)claude\.ai/code/session_", message):
                  violations.append(f"{sha}: prohibited Claude Code session URL in commit message")
              if re.search(r"(?i)Generated (?:with|by) \[?Claude Code\]?", message):
                  violations.append(f"{sha}: prohibited Claude Code generated footer in commit message")

          if violations:
              print("Commit attribution policy violations detected:", file=sys.stderr)
              for item in violations:
                  print(f" - {item}", file=sys.stderr)
              sys.exit(1)

          print(f"Commit attribution policy passed for {len(seen)} commit(s).")
          PY
