name: Publish Runner MCP

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release version already recorded in pyproject.toml and server.json"
        required: true
        default: "0.1.1"

concurrency:
  group: runner-mcp-publish
  cancel-in-progress: false

jobs:
  build:
    name: "Validate and build release"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Check out exact main revision"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: "Verify release version metadata"
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          with Path("pyproject.toml").open("rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]
          server_version = json.loads(Path("server.json").read_text())["version"]

          if expected != project_version or expected != server_version:
              raise SystemExit(
                  f"Version mismatch: requested={expected!r}, "
                  f"pyproject={project_version!r}, server.json={server_version!r}"
              )
          PY

      - name: "Install release validation dependencies"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -e '.[dev]' build==1.3.0

      - name: "Run complete release check"
        run: bash scripts/release-check.sh

      - name: "Build wheel and source distribution"
        run: python -m build

      - name: "Upload immutable distribution artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-mcp-dist-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi-publish:
    name: "Publish package to PyPI"
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/aifordable-runner-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Download validated distributions"
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: runner-mcp-dist-${{ inputs.version }}
          path: dist/

      - name: "Publish exact distributions to PyPI with OIDC"
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  registry-publish:
    name: "Publish metadata to MCP Registry"
    needs: pypi-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Check out exact main revision"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Wait for exact version to become visible on PyPI"
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          expected = os.environ["EXPECTED_VERSION"]
          url = "https://pypi.org/pypi/aifordable-runner-mcp/json"

          for attempt in range(18):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      payload = json.load(response)
                  if expected in payload.get("releases", {}):
                      print(f"PyPI now exposes aifordable-runner-mcp {expected}")
                      break
              except Exception as exc:
                  print(f"PyPI visibility check {attempt + 1}/18 not ready: {type(exc).__name__}")
              time.sleep(10)
          else:
              raise SystemExit(f"aifordable-runner-mcp {expected} did not become visible on PyPI in time")
          PY

      - name: "Install pinned MCP Registry publisher"
        env:
          MCP_PUBLISHER_VERSION: "v1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "$url" --output mcp-publisher.tar.gz
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" mcp-publisher.tar.gz | sha256sum --check -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod 0755 mcp-publisher
          ./mcp-publisher validate server.json

      - name: "Authenticate to official MCP Registry with GitHub OIDC"
        run: ./mcp-publisher login github-oidc

      - name: "Publish metadata to official MCP Registry"
        run: ./mcp-publisher publish server.json

  github-release:
    name: "Create GitHub pre-release"
    needs: registry-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: "Download validated distributions"
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: runner-mcp-dist-${{ inputs.version }}
          path: dist/

      - name: "Create immutable release tag and GitHub pre-release"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          gh release create "$tag" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$TARGET_SHA" \
            --title "Runner MCP ${tag}" \
            --generate-notes \
            --prerelease
