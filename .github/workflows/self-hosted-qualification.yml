name: Runner MCP self-hosted qualification

on:
  # Admission is operator driven. Do not enqueue unqualified self-hosted
  # workers automatically on PR or branch pushes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-mcp-self-hosted-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Self-hosted qualification
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - runner-mcp-validation
    timeout-minutes: 20

    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prepare isolated job home
        shell: bash
        run: |
          isolated_home="$RUNNER_TEMP/runner-mcp-home"
          install -d -m 700 "$isolated_home" "$isolated_home/bin"
          ln -s "$(command -v python3)" "$isolated_home/bin/python"
          printf 'HOME=%s\n' "$isolated_home" >> "$GITHUB_ENV"
          printf '%s\n' "$isolated_home/bin" >> "$GITHUB_PATH"

      - name: Verify Python 3.12+
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, found {sys.version}")
          print(sys.version)
          PY

      - name: Create clean validation venv
        shell: bash
        run: |
          rm -rf .venv-ci
          python3 -m venv .venv-ci

      - name: Install fresh dependencies without persistent runner caches
        shell: bash
        run: |
          set -euo pipefail
          # Each qualification must resolve/install its dependencies afresh.
          # No cross-job RUNNER_TOOL_CACHE trees or unverified .complete marker.
          .venv-ci/bin/python -m pip install --disable-pip-version-check --no-cache-dir -e '.[dev]'

      - name: Compile Python
        run: .venv-ci/bin/python -m compileall -q src tests

      - name: Ruff
        run: .venv-ci/bin/python -m ruff check .

      - name: Pytest
        run: .venv-ci/bin/python -m pytest -q

      - name: Validate MCP Registry metadata
        env:
          MCP_PUBLISHER_VERSION: "v1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        shell: bash
        run: |
          set -euo pipefail
          # Never execute a publisher binary left by an earlier runner job.
          publisher_root="$RUNNER_TEMP/runner-mcp-publisher"
          install -d -m 700 "$publisher_root"
          archive="$publisher_root/mcp-publisher.tar.gz"
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "$url" --output "$archive"
          printf '%s  %s\\n' "$MCP_PUBLISHER_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$publisher_root" mcp-publisher
          chmod 0700 "$publisher_root/mcp-publisher"
          "$publisher_root/mcp-publisher" validate server.json

      - name: Whitespace check
        shell: bash
        run: |
          base="$(git merge-base HEAD origin/main)"
          git diff --check "$base"..HEAD

      - name: Clean five-minute demo
        shell: bash
        run: bash scripts/demo-smoke.sh

      - name: Built release artifact
        shell: bash
        run: PATH="$PWD/.venv-ci/bin:$PATH" bash scripts/release-artifact-smoke.sh
