name: Temporary Ruff import diagnostic

on:
  push:
    branches:
      - agent-bus-private-config
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Show Ruff import diff
        run: ruff check src/runner_mcp/config_manager.py --fix --diff
