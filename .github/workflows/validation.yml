name: Runner MCP validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-mcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Ruff and pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install -e '.[dev]'

      - name: Verify unique shipping version and registry parity
        shell: bash
        run: |
          set -euo pipefail
          # GitHub PR checks use a synthetic merge with target as first parent.
          # Main pushes also use the first parent of the newly merged commit.
          base="$(git rev-parse HEAD^1)"
          echo "RUNNER_MCP_BASE_COMMIT=$base" >> "$GITHUB_ENV"
          python scripts/check_release_version.py --base "$base"

      - name: Verify declared MCP tool catalogue baseline
        run: python scripts/attest_tool_catalogue.py

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Validate MCP Registry metadata
        env:
          MCP_PUBLISHER_VERSION: "v1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "$url" --output mcp-publisher.tar.gz
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" mcp-publisher.tar.gz | sha256sum --check -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod 0755 mcp-publisher
          ./mcp-publisher validate server.json
      - name: Whitespace check
        shell: bash
        run: |
          git diff --check "$RUNNER_MCP_BASE_COMMIT"..HEAD


  demo-smoke:
    name: Clean five-minute demo
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run clean demo end to end
        shell: bash
        run: bash scripts/demo-smoke.sh


  release-artifact:
    name: Built release artifact
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and install release artifacts
        shell: bash
        run: bash scripts/release-artifact-smoke.sh

      - name: Attest full 96-tool catalogue inside built wheel
        shell: bash
        run: python scripts/attest_tool_catalogue.py --wheel dist/*.whl --output dist/TOOL_CATALOGUE.json

      - name: Classify merged code release candidate
        id: candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_release_version.py --base "$(git rev-parse HEAD^1)" --github-output

      - name: Record immutable candidate identity and hashes
        if: steps.candidate.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" = "1"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" = "1"
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          python scripts/check_release_version.py

      - name: Preserve verified candidate for attended fleet admission
        if: steps.candidate.outputs.release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-mcp-candidate-${{ steps.candidate.outputs.version }}-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SOURCE_COMMIT
            dist/SHA256SUMS
            dist/TOOL_CATALOGUE.json
          if-no-files-found: error
          retention-days: 30

      - name: Record unapproved PR candidate provenance
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" = "1"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" = "1"
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > dist/PR_HEAD_COMMIT
          printf '%s\n' "$GITHUB_SHA" > dist/CI_MERGE_COMMIT
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          python scripts/check_release_version.py
          echo "UNAPPROVED_SOURCE_CANDIDATE - NOT A RELEASE OR INSTALL PERMISSION" \
            > dist/NOT_FOR_DEPLOYMENT

      - name: Preserve unapproved PR candidate for independently reviewed staging
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unapproved-mcp-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/TOOL_CATALOGUE.json
            dist/PR_HEAD_COMMIT
            dist/CI_MERGE_COMMIT
            dist/NOT_FOR_DEPLOYMENT
          if-no-files-found: error
          retention-days: 7
