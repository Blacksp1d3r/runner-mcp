name: Runner MCP validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-mcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Ruff and pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install -e '.[dev]'

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Validate MCP Registry metadata
        env:
          MCP_PUBLISHER_VERSION: "v1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "$url" --output mcp-publisher.tar.gz
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" mcp-publisher.tar.gz | sha256sum --check -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod 0755 mcp-publisher
          ./mcp-publisher validate server.json
      - name: Whitespace check
        shell: bash
        run: |
          base="$(git merge-base HEAD origin/main)"
          git diff --check "$base"..HEAD


  demo-smoke:
    name: Clean five-minute demo
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run clean demo end to end
        shell: bash
        run: bash scripts/demo-smoke.sh


  release-artifact:
    name: Built release artifact
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and install release artifacts
        shell: bash
        run: bash scripts/release-artifact-smoke.sh
