name: Runner MCP validation

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: runner-mcp-ci-${{ github.workflow }}-${{ github.ref }}
  # Behoud elke main-push, ook wanneer een latere docs-commit binnenkomt.
  # Alleen verouderde PR-hercontroles mogen worden afgebroken.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:


  disposable-systemd-user:
    name: Disposable real systemd user lifecycle
    # Required for ALL code, packaging, script, workflow and unknown changes.
    # Docs-only keeps the independently required docs/version/attribution
    # checks; no unchanged executable lifecycle needs to be rebuilt.
    needs: validate
    if: needs.validate.outputs.full_qualification == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout test-only lifecycle qualification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test actual isolated user manager restart and rollback
        shell: bash
        run: bash scripts/qualify_systemd_user_lifecycle_ci.sh

  release-reservation:
    name: Release reservation admission
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out synthetic PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate unique next-patch source reservation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_reservation.py

  validate:
    name: Ruff and pytest
    # Required check remains present for every PR and main push.
    outputs:
      full_qualification: ${{ steps.scope.outputs.full }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Docs-only updates keep required shipping-version, docs-memory,
      # whitespace and independent commit-attribution checks.
      # Unknown events, unavailable bases, failed diff or empty changes
      # fail CLOSED: all source/release tests still run.
      - name: Determine qualification scope (fail closed)
        id: scope
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          full=true
          base=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$(git rev-parse HEAD^1 2>/dev/null || true)"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            # A push can include multiple commits; HEAD^1 can miss code.
            base="$PUSH_BEFORE"
          fi
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=0
            only_docs=true
            if git diff --no-renames --name-only -z "$base" HEAD > "$RUNNER_TEMP/runner-mcp-changed-paths.z"; then
              while IFS= read -r -d '' changed_path; do
                changed=$((changed + 1))
                case "$changed_path" in
                  docs/*.md|docs/*.rst|docs/*.txt|AGENTS.md|README.md|CHANGELOG.md|CONTRIBUTING.md|SECURITY.md|FUTURE_LAB.md|QUICKSTART.md)
                    ;;
                  *)
                    only_docs=false
                    ;;
                esac
              done < "$RUNNER_TEMP/runner-mcp-changed-paths.z"
              if (( changed > 0 )) && [[ "$only_docs" == true ]]; then
                full=false
              fi
            fi
          fi
          printf 'full=%s\n' "$full" >> "$GITHUB_OUTPUT"
          echo "RUNNER_MCP_QUALIFICATION_SCOPE=$([[ "$full" == true ]] && echo FULL || echo DOCS_ONLY)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        if: steps.scope.outputs.full == 'true'
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install -e '.[dev]'

      - name: Verify unique shipping version and registry parity
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # PRs use the synthetic merge's first parent (target branch).
          # On main push, compare the WHOLE event, not only the last
          # commit: a pushed docs tail must not hide earlier code changes.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            base="$PUSH_BEFORE"
          else
            base="$(git rev-parse HEAD^1)"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "Runner-MCP release admission STOP: full Git base unavailable" >&2
            exit 1
          fi
          echo "RUNNER_MCP_BASE_COMMIT=$base" >> "$GITHUB_ENV"
          python scripts/check_release_version.py --base "$base"

      # Reuse the existing Git-tree-bound doc-memory verifier in this
      # already isolated disposable validation job; no new CI job or service.
      # The complete PR or push base was checked and exported above.
      - name: Verify changed docs using existing doc-memory precommit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/doc_memory/doc_memory.py precommit --base "$RUNNER_MCP_BASE_COMMIT"
          echo "DOC_MEMORY_PRECOMMIT_CI=PASS"

      - name: Verify declared MCP tool catalogue baseline
        if: steps.scope.outputs.full == 'true'
        run: python scripts/attest_tool_catalogue.py

      - name: Compile Python
        if: steps.scope.outputs.full == 'true'
        run: python -m compileall -q src tests

      - name: Ruff
        if: steps.scope.outputs.full == 'true'
        run: ruff check .

      - name: Pytest
        if: steps.scope.outputs.full == 'true'
        run: pytest -q

      - name: Validate MCP Registry metadata
        if: steps.scope.outputs.full == 'true'
        env:
          MCP_PUBLISHER_VERSION: "v1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "$url" --output mcp-publisher.tar.gz
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" mcp-publisher.tar.gz | sha256sum --check -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod 0755 mcp-publisher
          ./mcp-publisher validate server.json
      - name: Whitespace check
        shell: bash
        run: |
          git diff --check "$RUNNER_MCP_BASE_COMMIT"..HEAD


  demo-smoke:
    name: Clean five-minute demo
    needs: validate
    if: needs.validate.outputs.full_qualification == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run clean demo end to end
        shell: bash
        run: bash scripts/demo-smoke.sh


  release-artifact:
    name: Built release artifact
    # Pas een publiceerbare source-kandidaat bouwen na de bestaande volledige
    # demo én de onafhankelijke disposable-systemd-test (geen extra job).
    needs: [validate, demo-smoke, disposable-systemd-user]
    if: needs.validate.outputs.full_qualification == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and install release artifacts
        shell: bash
        run: bash scripts/release-artifact-smoke.sh

      - name: Attest full 95-tool catalogue inside built wheel
        shell: bash
        run: python scripts/attest_tool_catalogue.py --wheel dist/*.whl --output dist/TOOL_CATALOGUE.json

      - name: Classify merged code release candidate
        id: candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PUSH_BEFORE"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "Runner-MCP candidate STOP: full push base unavailable" >&2
            exit 1
          fi
          python scripts/check_release_version.py --base "$base" --github-output

      - name: Record immutable candidate identity and hashes
        if: steps.candidate.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" = "1"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" = "1"
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          python scripts/check_release_version.py

      - name: Preserve verified candidate for attended fleet admission
        if: steps.candidate.outputs.release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-mcp-candidate-${{ steps.candidate.outputs.version }}-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SOURCE_COMMIT
            dist/SHA256SUMS
            dist/TOOL_CATALOGUE.json
          if-no-files-found: error
          retention-days: 30

      # This is a separate *unsigned disposable lab* transport artifact,
      # never the normal trusted candidate wheel/production update bundle.
      - name: Build fixed Black Q7 lab transfer zipapp
        if: steps.candidate.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_fabric_q7_first_host_zipapp.py build
          mkdir -p dist/q7-lab
          cp dist/fabric-q7-first-host-import.pyz dist/q7-lab/
          (cd dist/q7-lab && sha256sum fabric-q7-first-host-import.pyz > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > dist/q7-lab/SOURCE_COMMIT
          printf '%s\n' 'UNSIGNED_KEYLESS_LAB_ONLY - NO_INSTALL_NO_AGENT_ACK' > dist/q7-lab/NOT_FOR_PRODUCTION

      - name: Preserve fixed Black Q7 lab transfer artifact
        if: steps.candidate.outputs.release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-mcp-black-q7-keyless-lab-${{ github.sha }}
          path: dist/q7-lab/
          if-no-files-found: error
          retention-days: 7

      - name: Record unapproved PR candidate provenance
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" = "1"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" = "1"
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > dist/PR_HEAD_COMMIT
          printf '%s\n' "$GITHUB_SHA" > dist/CI_MERGE_COMMIT
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          python scripts/check_release_version.py
          echo "UNAPPROVED_SOURCE_CANDIDATE - NOT A RELEASE OR INSTALL PERMISSION" \
            > dist/NOT_FOR_DEPLOYMENT

      - name: Preserve unapproved PR candidate for independently reviewed staging
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unapproved-mcp-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/TOOL_CATALOGUE.json
            dist/PR_HEAD_COMMIT
            dist/CI_MERGE_COMMIT
            dist/NOT_FOR_DEPLOYMENT
          if-no-files-found: error
          retention-days: 7
