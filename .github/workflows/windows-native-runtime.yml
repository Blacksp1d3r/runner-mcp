name: Windows native MCP runtime qualification

on:
  workflow_dispatch:
  push:
    branches:
      - diag/issue-194-mcp-runtime-matrix
    paths:
      - .github/workflows/windows-native-runtime.yml

jobs:
  windows-runtime:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.3', '3.12.10']
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - name: Show runtime
        shell: pwsh
        run: |
          python --version
          python -c "import sys,platform; print(sys.executable); print(platform.platform())"

      - name: Install exact known stack
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: `
            'mcp==2.2.0' `
            'mcp-types==2.2.0' `
            'pydantic==2.13.5' `
            'pydantic-core==2.46.5' `
            'starlette==0.52.1' `
            'httpx2==2.13.1' `
            'cryptography==50.0.2' `
            'cffi==2.1.1' `
            'rpds-py==2026.6.3'
          python -m pip check

      - name: Fresh-process stress
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($module in @('mcp_types','mcp.server')) {
            Write-Host "=== TEST: $module ==="
            for ($i=1; $i -le 200; $i++) {
              & python -X faulthandler -c "import importlib; importlib.import_module('$module')" *> $null
              $rc = $LASTEXITCODE
              if ($rc -ne 0) {
                Write-Host "FAIL: $module iteration=$i rc=$rc"
                if ($rc -lt 0) { Write-Host ('rc_hex=0x{0:X8}' -f ([uint32]$rc)) }
                exit 1
              }
              if (($i % 20) -eq 0) { Write-Host "$module $i/200 OK" }
            }
            Write-Host "PASS: $module 200/200"
          }
