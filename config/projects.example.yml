projects:
  example:
    display_name: Example Project
    repository: example-org/example-repository
    environment: staging
    root: "${RUNNER_MCP_EXAMPLE_ROOT}"
    health_url: "${RUNNER_MCP_EXAMPLE_HEALTH_URL}"
    allowed_services:
      - "${RUNNER_MCP_EXAMPLE_STAGING_SERVICE}"
    database_alias: "${RUNNER_MCP_EXAMPLE_DATABASE}"
    test_profiles:
      lint:
        argv:
          - "${RUNNER_MCP_EXAMPLE_LINT_EXECUTABLE}"
          - "check"
          - "."
        cwd: "."
        timeout_seconds: 300
        max_log_bytes: 2000000
        env_passthrough: []
