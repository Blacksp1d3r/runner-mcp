projects:
  example:
    display_name: Example Project
    repository: example-org/example-repository
    environment: staging
    adapter: python
    root: "${RUNNER_MCP_EXAMPLE_ROOT}"
    health_url: "${RUNNER_MCP_EXAMPLE_HEALTH_URL}"
    services:
      example-service:
        unit: "${RUNNER_MCP_EXAMPLE_STAGING_SERVICE}"
        allow_start: false
        allow_stop: false
        allow_restart: false
    database_alias: "${RUNNER_MCP_EXAMPLE_DATABASE}"
    database:
      engine: postgresql
      dsn_env: RUNNER_MCP_DB_EXAMPLE
    deployment:
      release_root: "${RUNNER_MCP_EXAMPLE_RELEASE_ROOT}"
      service: example-service
      required_tests: []
      run_migrations: false
    test_profiles:
      lint:
        argv:
          - "${RUNNER_MCP_EXAMPLE_LINT_EXECUTABLE}"
          - "check"
          - "."
        cwd: "."
        timeout_seconds: 300
        max_log_bytes: 2000000
        env_passthrough: []
