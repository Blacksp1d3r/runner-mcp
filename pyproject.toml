[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "runner-mcp"
version = "0.1.0"
description = "Secure, self-hosted MCP service for controlled development and staging operations."
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.0,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "starlette>=0.48,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
