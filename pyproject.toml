[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aifordable-runner-mcp"
version = "0.1.1"
description = "Security-first self-hosted MCP for controlled AI development and staging operations."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Blacksp1d3r" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "self-hosted", "ai-tools", "developer-tools", "devops", "staging", "security", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "setuptools>=75",
  "mcp>=2.0,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "starlette>=0.48,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.13,<1",
]

[project.scripts]
runner-mcp = "runner_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Blacksp1d3r/runner-mcp"
Repository = "https://github.com/Blacksp1d3r/runner-mcp"
Issues = "https://github.com/Blacksp1d3r/runner-mcp/issues"
Documentation = "https://github.com/Blacksp1d3r/runner-mcp#readme"
Changelog = "https://github.com/Blacksp1d3r/runner-mcp/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
